[package]
name = "aurora-launcher-client"
version = "0.0.1"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["hot", "image", "tokio"] }
prost = "0.14.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"

[build-dependencies]
tonic-build = "0.14.9"
